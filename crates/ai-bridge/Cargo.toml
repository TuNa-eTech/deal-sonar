[package]
name = "dealsonar-ai-bridge"
description = "Hardened CLI AI bridge (claude, codex, agy, mock), schema validation, batch bisection, and offline evaluation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "eval"
path = "src/bin/eval.rs"

[dependencies]
async-trait = ">=0.1.80, <0.1.89"
rand = "0.8"
regex = ">=1.10, <1.12"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = ">=1.38, <1.43", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing = ">=0.1.40, <0.1.42"

[target.'cfg(unix)'.dependencies]
libc = ">=0.2.155, <0.2.170"

[dev-dependencies]
tokio = { version = ">=1.38, <1.43", features = ["full", "test-util"] }
