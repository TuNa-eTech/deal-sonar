[workspace]
resolver = "2"
members = ["crates/protocol", "crates/native-host", "crates/ai-bridge", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
dealsonar-protocol = { path = "crates/protocol" }
