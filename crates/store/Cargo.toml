[package]
name = "dealsonar-store"
description = "SQLite persistence, migrations, FTS5 search, dynamic JSON queries, and durable queues for DealSonar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid = { version = ">=1.1, <1.2", features = ["serde"] }

[dev-dependencies]
tempfile = ">=3.10, <3.15"
