[package]
name = "dealsonar-notify"
description = "OS keyring secrets, Telegram Bot API sender & poller, CSV/XLSX exporters, and signed webhooks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
hmac = "0.12"
keyring = "2.3"
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls"] }
rust_xlsxwriter = "=0.78.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "=1.42.0", features = ["sync", "time"] }
ulid = { version = "=1.1.3", features = ["serde"] }

[dev-dependencies]
tokio = { version = "=1.42.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "test-util"] }
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }
