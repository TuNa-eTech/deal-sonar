[package]
name = "dealsonar-core"
description = "DealSonar central domain, multi-profile IPC server, T0-T7 pipeline, preview, ruleset lifecycle, scheduler, background workers, Ed25519 licensing, and Tauri command facade"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
base64ct = "=1.6.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dealsonar-ai-bridge.workspace = true
dealsonar-notify.workspace = true
dealsonar-protocol.workspace = true
dealsonar-rules.workspace = true
dealsonar-store.workspace = true
der = "=0.7.9"
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "fast", "rand_core"] }
rand = "0.8"
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tracing = ">=0.1.40, <0.1.42"
ulid.workspace = true
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
async-trait = ">=0.1.80, <0.1.89"
tempfile.workspace = true
tokio = { version = "=1.42.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "test-util"] }
