[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/native-host",
    "crates/rules",
    "crates/store",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "=1.42.0", features = ["rt", "rt-multi-thread", "macros", "io-util", "io-std", "net", "sync", "time", "process"] }
ulid = { version = "=1.1.3", features = ["serde"] }
tempfile = ">=3.10, <3.15"
dealsonar-protocol = { path = "crates/protocol" }
dealsonar-native-host = { path = "crates/native-host" }
dealsonar-rules = { path = "crates/rules" }
dealsonar-store = { path = "crates/store" }
