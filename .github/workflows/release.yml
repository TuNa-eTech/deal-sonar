name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-release.mjs
      - name: Check extension identity and distribution scripts
        run: |
          node scripts/extension-identity.mjs
          node --test scripts/*.test.mjs
          node scripts/distribution-evidence.mjs

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  extension:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-release.mjs
      - run: pnpm ext:build
      - run: pnpm ext:test
      - name: Package extension for both channels
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/package-extension.mjs apps/extension/dist extension-staging
          mkdir -p release-assets
          # Internal trial: keeps the manifest key, so the extension ID is stable and pairs with
          # the Desktop app. Load unpacked only; not a customer install path.
          (cd extension-staging/internal-unpacked && zip -r "../../release-assets/DealSonar-extension-${RELEASE_TAG}-internal-unpacked.zip" .)
          # Web Store upload: manifest key removed (the store owns the item ID).
          (cd extension-staging/web-store && zip -r "../../release-assets/DealSonar-extension-${RELEASE_TAG}-webstore.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Optional publisher credentials, owned by the project owner. Without them the build still
      # succeeds but is labelled an internal trial build by scripts/release-manifest.mjs.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # For certificates whose key lives in an HSM / cloud signing service (no exportable PFX).
      # Repository variable holding the provider CLI call, e.g. `<signing-cli> ... "%1"`.
      WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Export release version for the app
        # The app reports this to the extension (hello.ok) so both sides can compare releases;
        # without it the crate version (0.1.0) would be sent regardless of the tag.
        run: echo "DEALSONAR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build native messaging relay
        run: cargo build --locked --release -p dealsonar-native-host --target '${{ matrix.target }}'
      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Prepare version and bundled relay
        run: node scripts/prepare-release.mjs '${{ matrix.target }}'
      - name: Build desktop installer (signed when publisher credentials are present)
        working-directory: apps/desktop
        env:
          # AppImage packaging uses extraction instead of FUSE on hosted runners.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm dlx @tauri-apps/cli@2.10.1 build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config release.conf.json -- --locked
      - name: Collect installers
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import shutil

          target = os.environ['RELEASE_TARGET']
          tag = os.environ['RELEASE_TAG']
          root = pathlib.Path('target') / target / 'release' / 'bundle'
          output = pathlib.Path('release-assets')
          output.mkdir(exist_ok=True)
          expected = ['.deb', '.AppImage'] if 'linux' in target else ['.exe'] if 'windows' in target else ['.dmg']
          for suffix in expected:
              files = list(root.rglob(f'*{suffix}'))
              if len(files) != 1:
                  raise SystemExit(f'Expected one {suffix} installer, found: {files}')
              shutil.copy2(files[0], output / f'DealSonar-{tag}-{target}{suffix}')
          PY
      - name: Record provenance and signing state of each installer
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          require=()
          if [[ "$RUNNER_OS" == "Windows" && ( -n "$WINDOWS_CERTIFICATE" || -n "$WINDOWS_SIGN_COMMAND" ) ]]; then require=(--require-signing); fi
          if [[ "$RUNNER_OS" == "macOS" && -n "$APPLE_CERTIFICATE" ]]; then require=(--require-signing); fi
          for installer in release-assets/DealSonar-*; do
            case "$installer" in *.provenance.json) continue;; esac
            node scripts/release-provenance.mjs --target "$RELEASE_TARGET" --file "$installer" --tag "$RELEASE_TAG" "${require[@]}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [extension, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Decide channel and write release manifest
        id: channel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-manifest.mjs --tag "$RELEASE_TAG" --dir release-assets | tee channel.log
          grep '^channel=' channel.log >> "$GITHUB_OUTPUT"
          mv release-assets/release-notes.md "$RUNNER_TEMP/release-notes.md"
      - name: Generate checksums
        working-directory: release-assets
        run: |
          shopt -s extglob
          sha256sum !(SHA256SUMS.txt) > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          flags=()
          title="DealSonar $RELEASE_TAG"
          # Only a release that passed every customer gate is published as a normal release.
          if [[ "$RELEASE_TAG" == *-* || "$CHANNEL" != "customer" ]]; then flags+=(--prerelease); fi
          if [[ "$CHANNEL" != "customer" ]]; then title="$title (bản thử nội bộ)"; fi
          # Publish only after every test and platform build succeeds. On rerun,
          # update assets and notes on the existing release rather than creating a duplicate.
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            if [[ "$CHANNEL" == "customer" && "$RELEASE_TAG" != *-* ]]; then
              gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease=false
            else
              gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
            fi
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
              --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${flags[@]}"
          fi
