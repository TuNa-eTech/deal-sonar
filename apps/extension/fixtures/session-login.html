<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng nhập Facebook</title>
  </head>
  <body>
    <div role="main">
      <h2>Bạn phải đăng nhập để tiếp tục.</h2>
      <form id="login_form" action="/login/device-based/regular/login/" method="post">
        <input type="text" name="email" placeholder="Email hoặc số điện thoại" />
        <input type="password" name="pass" placeholder="Mật khẩu" />
        <button type="submit">Đăng nhập</button>
      </form>
    </div>
  </body>
</html>
